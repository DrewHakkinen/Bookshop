<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books to buy</title>
</head>

<body>

    <h1>Books</h1>

    <table class="table table-striped">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Publication Year</th>
            <th>ISBN</th>
            <th>Price</th>
        </tr>

        <tr th:each="book : ${books}">
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.publicationYear}">Year</td>
            <td th:text="${book.isbn}">Isbn</td>
            <td th:text="${book.price}">Price</td>
            <td><a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.bookId})}">Delete Book</a></td>
            <td><a th:href="@{/edit/{id}(id=${book.bookId})}">Edit Book</a></td>
        </tr>
    </table>
    <p><a class="btn btn-success" th:href="@{/newbook}">Add Book</a></p>
    <p><a class="btn btn-success" th:href="@{/categorylist}">See categories</a></p>

</body>

</html>
