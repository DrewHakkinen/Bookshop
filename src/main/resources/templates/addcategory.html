<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add category</title>
</head>

<body>
    <h1>New Category</h1>
    <form method="post" action="#" th:action="@{/savecategory}" th:object=${book}>
        <p>Category: <input type="text" th:field="${category.name}" /></p>
        <input type="submit" value="Submit" /> <input type="reset" value="Reset" />
    </form>
</body>

</html>
